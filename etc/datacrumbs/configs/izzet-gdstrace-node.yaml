name: izzet-gdstrace-node
# GDS-Trace host config: base syscall-I/O custom probes + a cuFile uprobe category so DataCrumbs
# traces GDS ops (libcufile.so) alongside syscalls/block. cuFile = type-2 userspace uprobe.
capture_probes:
  - name: custom1
    start_event_id: 100000
    probe: custom
    type: custom
    file: @DATACRUMBS_PROJECT_PATH@/etc/datacrumbs/plugins/custom_probes/sys_io/sysio.bpf.c
    probes: @DATACRUMBS_PROJECT_PATH@/etc/datacrumbs/plugins/custom_probes/sys_io/probes.json
    process_header: @DATACRUMBS_PROJECT_PATH@/etc/datacrumbs/plugins/custom_probes/sys_io/sysio_process.h
    event_type: 2
  - name: cufile
    probe: uprobe
    type: binary
    file: /usr/local/cuda-12.6/targets/x86_64-linux/lib/libcufile.so
    regex: cuFile(Read|Write|BatchIOSubmit|BatchIOGetStatus|HandleRegister).*
